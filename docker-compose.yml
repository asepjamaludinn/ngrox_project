services:
  app:
    build: ./app
    ports:
      - "8080:3000"
    restart: always
    environment:
      - DB_HOST=mongo
      - DB_PORT=27017
    links:
      - mongo
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules

  mongo:
    image: mongo
    ports:
      - "27017:27017"
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=app
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
